<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: #fafafa;
        color: #262626;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .stat {
        font-size: 13px;
        margin-bottom: 12px;
      }
      .stat b {
        font-size: 16px;
      }
      .bar {
        height: 6px;
        border-radius: 3px;
        background: #e0e0e0;
        overflow: hidden;
        margin-top: 6px;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: #ed4956;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 9px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: rgba(168, 168, 168, 0.22);
        color: #262626;
      }
      .hint {
        font-size: 11px;
        opacity: 0.65;
        margin-top: 10px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Socialfix</h1>
    <div class="stat">
      Instagram unfollows today: <b id="count">0</b> / <span id="cap">150</span>
      <div class="bar"><i id="barfill" style="width: 0%"></i></div>
    </div>
    <button id="stop">Stop bulk run</button>
    <div class="hint" id="status"></div>
    <div class="hint">
      Other actions (unlikes, unsaves, YouTube removals) have their own separate
      daily budgets. Stop works on any supported site.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
